name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'packages/api-types/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'packages/api-types/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: lint
        run: yarn workspace realestate-factory-frontend lint

      - name: typecheck
        run: yarn workspace realestate-factory-frontend typecheck

      - name: tests
        run: yarn workspace realestate-factory-frontend test

      - name: build
        run: yarn workspace realestate-factory-frontend build
        env:
          VITE_API_BASE_URL: http://localhost:8004/api/v1

      # Playwright against a live preview deploy lands in S19.
