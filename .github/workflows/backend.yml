name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'packages/api-types/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'packages/api-types/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # See backend/tests/conftest.py — the golden set needs a pinned hash seed
  # until S10 makes prompts data.
  PYTHONHASHSEED: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen

      - name: lint
        run: uv run ruff check .

      - name: typecheck
        run: uv run mypy app

      - name: tests and golden set
        run: uv run pytest -q

      # A dependency added without re-exporting requirements.txt fails here.
      # The comparison drops comment lines: uv writes the output path into the
      # file's own header, so a temp-file export never matches byte for byte.
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-hashes --no-dev --no-emit-project -o /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

      - name: dependency audit
        run: uv run --with pip-audit pip-audit --strict -r requirements.txt

      # Blocking. Checks every column on Base.metadata by type, and every
      # migration by text — a migration can add a column the models never
      # declared. See scripts/check_money_columns.py.
      # Deliberately no GROQ_API_KEY: reading the schema must not require a
      # provider key, which is why Base lives in app/models/base.py.
      - name: no monetary column typed Float
        run: uv run python scripts/check_money_columns.py

      # The migration is not merely importable: it produces the DDL it claims
      # to, including the GiST index autogenerate does not emit.
      - name: migrations render, and the GiST index is in the DDL
        env:
          GROQ_API_KEY: ci-no-live-calls
        run: |
          uv run alembic upgrade head --sql > /tmp/schema.sql
          grep -qi "USING gist" /tmp/schema.sql \
            || { echo "::error::no GiST index in the rendered schema"; exit 1; }
          grep -qi "CREATE EXTENSION IF NOT EXISTS postgis" /tmp/schema.sql \
            || { echo "::error::postgis extension is not created"; exit 1; }

  # The repository tests need a real PostGIS: the schema uses geography, a
  # partial unique index and uuid keys, so a SQLite stand-in would prove that a
  # different schema works.
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: realestate
          POSTGRES_PASSWORD: realestate
          POSTGRES_DB: realestate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realestate -d realestate_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONHASHSEED: '0'
      GROQ_API_KEY: ci-no-live-calls
      # Alembic reads DATABASE_URL through envConfig; pytest reads
      # TEST_DATABASE_URL. Both point at the service container, whose port is
      # 5432 here — 5433 is only the local compose mapping.
      DATABASE_URL: postgresql+asyncpg://realestate:realestate@localhost:5432/realestate_test
      TEST_DATABASE_URL: postgresql+asyncpg://realestate:realestate@localhost:5432/realestate_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen

      - name: alembic upgrade head on an empty database
        run: uv run alembic upgrade head

      - name: downgrade is reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: the GiST index exists on properties.geom
        run: |
          PGPASSWORD=realestate psql -h localhost -U realestate -d realestate_test \
            -c "\d properties" | tee /tmp/d_properties.txt
          grep -qi "gist" /tmp/d_properties.txt \
            || { echo "::error::ix_properties_geom is not on the table"; exit 1; }

      - name: repository tests, including the terminal-finality guard
        run: uv run pytest tests/test_job_repository.py -q
